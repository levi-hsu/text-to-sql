# Experiment 2, RL-continuation arm: after SFT on Spider, continue with
# GRPO (not SFT -- see configs/bird_adapt_sft.yaml for the other half) on
# the small BIRD-dev pool built by scripts/build_bird_adapt_data.py
# (debit_card_specializing + california_schools, 122 train rows).
#
# Starts from runs/sft_qwen2.5coder3b/adapter -- the SAME checkpoint
# configs/bird_adapt_sft.yaml starts from (see that file's header for why:
# only the continuation method should differ between the two models).
#
# num_generations=4, not 2: this is not optional. The main RL v1 run
# (configs/rl.yaml before its v2 revision) proved that num_generations=2
# leaves GRPO gradient-starved (mean frac_reward_zero_std ~0.85 across that
# whole 300-step run); v2's num_generations=4 brought that down to ~0.56
# and produced the first real RL learning signal in this project. Using 2
# here would handicap the RL side of this comparison by construction, not
# give it a fair test against the SFT-continuation arm.
#
# max_steps is NOT reused from configs/rl.yaml's 300 -- that config trained
# on 2000 Spider rows, so 300 steps at 8 prompts/optimizer-step was ~1.2
# passes over the data. Reusing 300 verbatim against a pool 16x smaller
# (122 rows) would mean ~15-16 passes, heavy overfitting risk on a set this
# small. max_steps=40 keeps roughly the same order of relative exposure
# (40 steps * 8 prompts/step / 122 rows =~ 2.6 passes) as a starting point,
# not an exact match -- watch health_log.jsonl (frac_reward_zero_std,
# degenerate_output_rate, heldout_execution_accuracy) same as any other RL
# run, and the early-stop gate below is armed same as configs/rl.yaml.
#
# reward.partial_credit_executes_wrong_result kept at 0.1, same value and
# same rationale as configs/rl.yaml -- see rl_reward.py's module docstring.

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  sft_adapter: runs/sft_qwen2.5coder3b/adapter   # NOT checkpoint-500 -- see header

data:
  train_jsonl: data/bird_adapt/bird_train_pool.jsonl   # from scripts/build_bird_adapt_data.py
  tables: data/bird-dev/dev_tables.json
  db_dir: data/bird-dev/dev_databases
  max_prompt_length: 1024   # informational only -- see configs/rl.yaml's comment on this field
  max_completion_length: 256

grpo:
  num_generations: 4
  per_device_train_batch_size: 4   # must be a multiple of num_generations; 1 prompt per micro-batch
  gradient_accumulation_steps: 8   # 8 prompts per optimizer step, same ratio as configs/rl.yaml
  temperature: 1.3   # same as configs/rl.yaml -- see that file's comment on why this was raised
  learning_rate: 1.0e-5
  beta: 0.04
  num_train_epochs: 1
  max_steps: 40   # see header -- scaled down from configs/rl.yaml's 300 for this much smaller pool
  use_vllm: false
  logging_steps: 2
  save_strategy: steps
  save_steps: 10
  save_total_limit: 4
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  report_to: none

reward:
  partial_credit_executes_wrong_result: 0.1

output:
  run_dir: runs/bird_adapt_rl

monitor:
  eval_steps: 10   # 4 health checks across the 40-step run
  heldout_jsonl: data/bird_adapt/bird_pool_heldout.jsonl   # same-schema, unseen-question slice --
                                                              # NOT the crossdb-eval set, which is
                                                              # scored post-hoc via run_bird_adapt_eval.sh
  heldout_size: 31   # the whole pool-heldout slice -- small anyway
  max_degenerate_rate: 0.15
  min_distinct_ratio: 0.20
  max_hallucination_rate: 0.05

  log_jsonl: runs/bird_adapt_rl/health_log.jsonl

  early_stop_enabled: true
  early_stop_after_checks: 3   # lands at step 30 of 40 given eval_steps=10
  early_stop_frac_zero_std_threshold: 0.9
