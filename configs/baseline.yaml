# Config for the zero-shot baseline arm (see plan.md, "Arms" section).
# Qwen2.5-Coder-3B-Instruct, no fine-tuning, evaluated on Spider-dev.
# BIRD-dev fields are left null until BIRD-dev is downloaded (see plan.md
# "Open items"); generate_sql.py / eval_sql.py skip a dataset whose paths
# are null.

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16          # bf16 weights, ~6GB VRAM for a 3B model; fits in 8GB with headroom
  device: cuda
  load_in_4bit: false      # flip to true (uses bitsandbytes) if you hit OOM at inference

generation:
  max_new_tokens: 256
  do_sample: false          # greedy decoding, deterministic baseline
  temperature: 1.0          # ignored when do_sample is false
  num_beams: 1
  batch_size: 4             # lower this if you hit OOM

data:
  spider_tables: data/spider_data/tables.json
  spider_db_dir: data/spider_data/database
  spider_dev: data/spider_data/dev.json
  spider_dev_gold: data/spider_data/dev_gold.sql

  bird_tables: data/bird-dev/dev_tables.json
  bird_db_dir: data/bird-dev/dev_databases
  bird_dev: data/bird-dev/dev.json
  bird_dev_gold: data/bird-dev/dev.sql

output:
  run_dir: runs/baseline_qwen2.5coder3b
