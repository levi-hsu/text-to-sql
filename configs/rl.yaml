# Config for the RL arm (see plan.md, "models" -> "RL arm", and "Pre-RL SFT
# sanity check"). GRPO via TRL's GRPOTrainer, continuing training from the
# SFT arm's LoRA adapter -- not a fresh adapter -- against the same base
# model and QLoRA setup as configs/sft.yaml, so the SFT-vs-RL comparison
# only varies the post-training procedure.
#
# vLLM/Unsloth are deliberately NOT used on this first attempt. Two reasons:
# (1) this exact card already hit the 8GB ceiling during plain SFT
#     forward/backward at max_seq_length=1024 with no rollout generation at
#     all (see configs/sft.yaml's comment on max_seq_length) -- adding a
#     second inference-mode copy of memory pressure on top via vLLM is a
#     bigger first step than this project's own history suggests is safe;
# (2) the SFT adapter was trained with plain transformers + peft, not
#     Unsloth, and loading that adapter into an Unsloth-wrapped base model
#     has not been verified to work -- see train_rl.py's NOTE.
# TRL's use_vllm=false path falls back to plain transformers .generate() for
# rollouts, which reuses the exact model/adapter-loading code already
# proven to work in generate_sql.py. Revisit vLLM/Unsloth as a throughput
# optimization once this is confirmed to fit and run (plan.md: "vLLM is
# used for rollout generation during RL if throughput requires it").
#
# ---- v2 (this run) -----------------------------------------------------
# The first real run (runs/rl_qwen2.5coder3b, still on disk, not touched by
# this config) finished all 300 steps cleanly but with frac_reward_zero_std
# around 0.65-0.9 essentially throughout -- most GRPO groups contributed no
# gradient -- and Spider-dev execution accuracy came back bit-identical to
# the SFT checkpoint it started from (0.6973 both). Diagnosis: at
# num_generations=2 with a binary 0/1 reward, and starting from an SFT
# checkpoint already converged to loss 0.023 after 3 epochs on these exact
# rows (configs/sft.yaml), most groups' two samples land on the same
# outcome by construction, not by bad luck. Three changes here target that
# directly, without touching data.train_jsonl or the core execution-match
# objective:
#   1. model.sft_adapter now points at the SFT run's checkpoint-500 instead
#      of its fully-converged final adapter (loss was still dropping
#      sharply at step 500 -- see runs/sft_qwen2.5coder3b/checkpoint-500's
#      trainer_state.json). A less-memorized starting policy has more
#      residual uncertainty on these prompts, which directly helps
#      frac_reward_zero_std as a side effect, and is also a plausible fix
#      for the SFT arm's own BIRD-dev regression (Spider-dev EX 0.6973 /
#      BIRD-dev EX 0.1877, worse than the untrained baseline's 0.2073) --
#      see plan.md-adjacent discussion on overtraining.
#   2. grpo.num_generations: 2 -> 4 (grpo.per_device_train_batch_size: 2 ->
#      4 to match, keeping 1 prompt per micro-batch as before). More
#      independent samples per group directly lowers the chance all of them
#      land on identical reward. This roughly doubles rollout-generation
#      VRAM pressure -- confirm headroom with configs/rl_trial.yaml (updated
#      to match) before trusting the full 300-step run below.
#   3. reward.partial_credit_executes_wrong_result: a small (0.1) reward for
#      completions that execute cleanly but return the wrong result, on top
#      of the unchanged 1.0-for-exact-match objective. This is deliberately
#      NOT a graded "how close was it" reward -- see rl_reward.py's module
#      docstring for why that kind of partial-credit design was avoided:
#      accuracy has to stay the dominant, undiluted optimization target, so
#      this only ever differentiates among completions that are already
#      wrong, and can never let a wrong completion outscore a correct one.

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  sft_adapter: runs/sft_qwen2.5coder3b/checkpoint-500   # v2: less-converged than .../adapter (see header)

data:
  train_jsonl: data/sft/spider_train_subset.jsonl   # same rows/budget as the SFT arm (plan.md)
  # Renamed from spider_tables/spider_db_dir (generic now, not Spider-specific --
  # configs/bird_adapt_rl.yaml points these at BIRD instead; train_rl.py just
  # reads whatever tables.json/db_dir matches train_jsonl's db_ids).
  tables: data/spider_data/tables.json
  db_dir: data/spider_data/database
  max_prompt_length: 1024      # informational only -- trl 1.9.2's GRPOConfig does not accept
                                  # this as a constructor arg, so train_rl.py does NOT pass it;
                                  # kept here to document that every row in train_jsonl already
                                  # fits under this bound (build_sft_data.py's own filter for
                                  # the SFT arm). See train_rl.py's comment at the GRPOConfig call.
  max_completion_length: 256   # matches configs/sft_eval.yaml's generation.max_new_tokens

grpo:
  # v2: raised from 2 to 4 (see header note). If this OOMs, the first things
  # to trade off are max_completion_length above and/or
  # gradient_accumulation_steps below, in that order -- confirm on
  # configs/rl_trial.yaml first, not on this 300-step run directly.
  num_generations: 4
  per_device_train_batch_size: 4   # must be a multiple of num_generations; kept at
                                     # num_generations so this is still 1 prompt per micro-batch,
                                     # same ratio as the first run's 2/2
  gradient_accumulation_steps: 8
  # Raised from trl's default of 1.0 after the first trial run showed
  # frac_reward_zero_std=1.0 at every logged step -- every sampled group had zero
  # reward variance even at the default temperature, most likely because these
  # rows are the exact ones the SFT arm already trained on for 3 epochs, leaving
  # little entropy for GRPO to sample variance from. No extra VRAM cost, unlike
  # raising num_generations would be. Kept at 1.3 for v2 -- num_generations,
  # sft_adapter, and partial_credit are the levers being changed here instead;
  # revisit temperature only if frac_reward_zero_std is still high after those.
  temperature: 1.3
  learning_rate: 1.0e-5   # well below SFT's 2e-4: RL fine-tunes an already-competent
                            # policy, large steps risk collapsing it rather than refining it
  beta: 0.04   # KL penalty against the reference policy (SFT adapter disabled, not a
                # second loaded model -- TRL's PEFT support computes the reference this
                # way). Keeps RL from drifting far from the SFT checkpoint per step; see
                # plan.md's sanity-check section for why an unconstrained policy is a risk.
  num_train_epochs: 1
  max_steps: 300   # unchanged from the first run, for a like-for-like comparison of the
                     # same step budget under the new settings
  use_vllm: false
  logging_steps: 5
  save_strategy: steps
  save_steps: 50
  save_total_limit: 3
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  report_to: none

# See rl_reward.py's module docstring for the full design rationale. Set
# partial_credit_executes_wrong_result to 0.0 to fall back to the original
# strict binary reward used in the first RL run.
reward:
  partial_credit_executes_wrong_result: 0.1

output:
  run_dir: runs/rl_qwen2.5coder3b_v2   # v2: separate dir, first run's runs/rl_qwen2.5coder3b is untouched

# Ongoing-detection cadence during training -- see scripts/rl_health_callback.py
# and plan.md's "Ongoing RL health monitoring" section.
monitor:
  eval_steps: 25         # run the health check every N optimizer steps
  heldout_jsonl: data/sft/rl_heldout.jsonl   # 50 Spider-dev examples, built by
                                                # scripts/build_rl_heldout.py -- disjoint
                                                # from training data by construction
  heldout_size: 50
  max_degenerate_rate: 0.15   # looser than check_sft_checkpoint.py's 0.10: mid-training
                                # generations are noisier than a finished checkpoint's
  min_distinct_ratio: 0.20     # looser than check_sft_checkpoint.py's 0.30: RL is expected
                                 # to sharpen the output distribution somewhat by design
  max_hallucination_rate: 0.05
  log_jsonl: runs/rl_qwen2.5coder3b_v2/health_log.jsonl

  # Early-run auto-stop (see scripts/rl_health_callback.py's module docstring for
  # the full reasoning). If frac_reward_zero_std is >= 0.9 on all of the first 3
  # health checks -- i.e. through step 75 at eval_steps=25 -- training stops
  # automatically rather than spending the remaining 225 steps with no reward
  # variance to learn from. Only armed for these first 3 checks, never again
  # after: a rising frac_reward_zero_std later in a successful run means the
  # policy has converged, not that it's stuck. Set early_stop_enabled: false to
  # go back to logging-only. Left enabled for v2: if num_generations=4 +
  # checkpoint-500 + partial_credit still can't get frac_reward_zero_std below
  # 0.9 in the first 3 checks, that's worth knowing early rather than after 300
  # steps again.
  early_stop_enabled: true
  early_stop_after_checks: 3
  early_stop_frac_zero_std_threshold: 0.9
