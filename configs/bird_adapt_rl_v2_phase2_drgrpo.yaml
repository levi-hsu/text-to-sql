# RL-continue-v2, phase 2 of 2, Dr. GRPO variant. Continues from phase 1's
# Dr. GRPO adapter (runs/bird_adapt_rl_v2_phase1_drgrpo/adapter), training
# on the FULL 122-example pool (data/bird_adapt/bird_train_pool.jsonl, the
# SAME file every other continuation config uses -- not resampled).
# Identical to configs/bird_adapt_rl_v2_phase2.yaml in every field except
# `algo`, model.sft_adapter, and the output/monitor paths.

algo: dr_grpo

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  sft_adapter: runs/bird_adapt_rl_v2_phase1_drgrpo/adapter   # continues THIS run's phase 1 output

data:
  train_jsonl: data/bird_adapt/bird_train_pool.jsonl   # full 122-example pool, same file as always
  tables: data/bird-dev/dev_tables.json
  db_dir: data/bird-dev/dev_databases
  max_prompt_length: 1024
  max_completion_length: 256

grpo:
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  temperature: 1.3
  learning_rate: 1.0e-5
  beta: 0.04
  num_train_epochs: 1
  max_steps: 30
  use_vllm: false
  logging_steps: 2
  save_strategy: steps
  save_steps: 5
  save_total_limit: 6
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  report_to: none

reward:
  partial_credit_mode: graduated
  graduated_floor: 0.02
  graduated_max: 0.3

output:
  run_dir: runs/bird_adapt_rl_v2_drgrpo

monitor:
  eval_steps: 5
  heldout_jsonl: data/bird_adapt/bird_pool_heldout.jsonl
  heldout_size: 31
  max_degenerate_rate: 0.15
  min_distinct_ratio: 0.20
  max_hallucination_rate: 0.05
  log_jsonl: runs/bird_adapt_rl_v2_drgrpo/health_log.jsonl
  early_stop_enabled: true
  early_stop_after_checks: 3
  early_stop_frac_zero_std_threshold: 0.9
