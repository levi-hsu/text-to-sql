# Third eval slice for RL-continue-v2: crossdb-eval. See
# configs/bird_adapt_sft_eval_crossdb.yaml for the rationale -- identical
# except the adapter and run_dir.
#
# This is scored exactly once, after scripts/select_best_bird_adapt_rl_checkpoint.py
# has already fixed the checkpoint using pool_heldout only -- see that
# script's docstring for why crossdb must never be used for selection.

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  device: cuda
  load_in_4bit: true
  adapter: runs/bird_adapt_rl_v2/adapter

generation:
  max_new_tokens: 256
  do_sample: false
  temperature: 1.0
  num_beams: 1
  batch_size: 4

data:
  bird_tables: data/bird-dev/dev_tables.json
  bird_db_dir: data/bird-dev/dev_databases
  bird_dev: data/bird_adapt/bird_crossdb_eval_dev.json
  bird_dev_gold: data/bird_adapt/bird_crossdb_eval_gold.sql

output:
  run_dir: runs/bird_adapt_rl_v2_eval
