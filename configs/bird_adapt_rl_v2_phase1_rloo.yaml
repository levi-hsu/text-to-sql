# RL-continue-v2, phase 1 of 2, RLOO variant. Identical to configs/
# bird_adapt_rl_v2_phase1.yaml in every field except `algo` and the output/
# monitor paths. Uses the SAME data/bird_adapt/bird_train_pool_reachable.jsonl
# bucket_bird_pool_by_difficulty.py already produced for the GRPO v2 run --
# NOT regenerated here. That bucketing only depends on the shared starting
# checkpoint (runs/sft_qwen2.5coder3b/adapter) it was probed against, not on
# which RL algorithm trains on it afterward, so re-running the bucketing
# step would add no information and would risk a different (non-comparable)
# reachable-subset split by chance of resampling. Same starting checkpoint,
# same num_generations/lr/beta/temperature/max_steps/reward settings as
# phase1.yaml. Only train_rl.py's algo dispatch differs -- see that file's
# algo=="rloo" branch for the implementation and its unverified-against-a-
# real-run caveats.
#
# Phase 2 (configs/bird_adapt_rl_v2_phase2_rloo.yaml) continues from THIS
# phase's output adapter (runs/bird_adapt_rl_v2_phase1_rloo/adapter), not
# from the GRPO phase 1 adapter.

algo: rloo

model:
  name_or_path: /home/levi/Documents/llm/Qwen2.5-Coder-3B-Instruct
  dtype: bfloat16
  sft_adapter: runs/sft_qwen2.5coder3b/adapter   # SAME shared start as bird_adapt_rl_v2_phase1.yaml

data:
  train_jsonl: data/bird_adapt/bird_train_pool_reachable.jsonl   # SAME file, unchanged -- not regenerated
  tables: data/bird-dev/dev_tables.json
  db_dir: data/bird-dev/dev_databases
  max_prompt_length: 1024
  max_completion_length: 256

grpo:
  num_generations: 4
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  temperature: 1.3
  learning_rate: 1.0e-5
  beta: 0.04
  num_train_epochs: 1
  max_steps: 50
  use_vllm: false
  logging_steps: 2
  save_strategy: steps
  save_steps: 10
  save_total_limit: 6
  bf16: true
  gradient_checkpointing: true
  optim: paged_adamw_8bit
  report_to: none

reward:
  partial_credit_mode: graduated
  graduated_floor: 0.02
  graduated_max: 0.3

output:
  run_dir: runs/bird_adapt_rl_v2_phase1_rloo

monitor:
  eval_steps: 10
  heldout_jsonl: data/bird_adapt/bird_pool_heldout.jsonl
  heldout_size: 31
  max_degenerate_rate: 0.15
  min_distinct_ratio: 0.20
  max_hallucination_rate: 0.05
  log_jsonl: runs/bird_adapt_rl_v2_phase1_rloo/health_log.jsonl
  early_stop_enabled: true
  early_stop_after_checks: 3
  early_stop_frac_zero_std_threshold: 0.9
